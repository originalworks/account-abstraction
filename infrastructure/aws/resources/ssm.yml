Transform: AWS::Serverless-2016-10-31

Parameters:
  BlobTxSignerQueueUrl:
    Type: String
  BlobTxSignerQueueArn:
    Type: String
  StandardTxSignerQueueUrl:
    Type: String
  StandardTxSignerQueueArn:
    Type: String
  OutcomeEventBusName:
    Type: String
  Environment:
    Type: String
  AaBlobBucketName:
    Type: String
  StandardSignerQueueMessageGroupId:
    Type: String

Resources:
  BlobTxSignerQueueUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/sqs/blob-tx-signer/url
      Type: String
      Value: !Ref BlobTxSignerQueueUrl

  BlobTxSignerQueueArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/sqs/blob-tx-signer/arn
      Type: String
      Value: !Ref BlobTxSignerQueueArn

  StandardTxSignerQueueUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/sqs/standard-tx-signer/url
      Type: String
      Value: !Ref StandardTxSignerQueueUrl

  StandardSignerQueueMessageGroupIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/sqs/standard-tx-signer/message-group-id
      Type: String
      Value: !Ref StandardSignerQueueMessageGroupId

  StandardTxSignerQueueArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/sqs/standard-tx-signer/arn
      Type: String
      Value: !Ref StandardTxSignerQueueArn

  OutcomeEventBusNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/event-bus/tx-outcome/name
      Type: String
      Value: !Ref OutcomeEventBusName

  AaBlobBucketNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /account-abstraction/${Environment}/s3/blob-bucket/name
      Type: String
      Value: !Ref AaBlobBucketName
